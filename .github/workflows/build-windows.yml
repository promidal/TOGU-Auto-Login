name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        working-directory: "Windows taslağı"
        shell: pwsh
        run: |
          iscc PortalKeepalive.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: PortalKeepalive-Windows-Installer
          path: |
            Windows taslağı/*.exe
            Windows taslağı/Output/*.exe
